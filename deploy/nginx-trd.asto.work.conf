# /etc/nginx/sites-available/trd.asto.work
#
# Run certbot AFTER installing this file with only the port 80 block, so it
# can complete the ACME challenge and inject the TLS directives itself:
#   sudo certbot --nginx -d trd.asto.work

server {
    listen 80;
    listen [::]:80;
    server_name trd.asto.work;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trd.asto.work;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/trd.asto.work/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/trd.asto.work/privkey.pem;

    # The dashboard has no authentication of its own.
    auth_basic           "MoneyClush";
    auth_basic_user_file /etc/nginx/.htpasswd-moneyclush;

    # Do not let the panel be framed or indexed.
    add_header X-Frame-Options       "DENY"        always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "no-referrer" always;
    add_header X-Robots-Tag          "noindex, nofollow" always;

    access_log /var/log/nginx/trd.asto.work.access.log;
    error_log  /var/log/nginx/trd.asto.work.error.log;

    location / {
        proxy_pass http://127.0.0.1:8642;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The frontend polls /api/state every 3s; keep upstream buffering off
        # so state updates are not held back.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
