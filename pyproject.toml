[project]
name = "moneyclush"
version = "0.1.0"
description = "Polymarket BTC Up/Down trading bot — research & execution"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.18.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "structlog>=24.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
